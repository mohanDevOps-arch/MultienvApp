services:

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"

  dev-backend:
    build: ./backend/dev
    container_name: dev-backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/dev/.env
    depends_on:
      - mongodb

  prod-backend:
    build: ./backend/prod
    container_name: prod-backend
    ports:
      - "3002:3002"
    env_file:
      - ./backend/prod/.env
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - dev-backend
      - prod-backend